function fbLabels(){$('fb').innerHTML=FB.map(([f,e])=>`<button aria-label="${FN[f]}" title="${FN[f]}" onclick="setFlag('${f}')">${ACC.cb?FL[f]:e}</button>`).join('');if(G)[...$('fb').children].forEach((b,i)=>b.className=FB[i][0]==G.flag?'on':'')}
function applyAcc(){const d=document.documentElement;d.style.setProperty('--fs',ACC.fs);d.dataset.hc=ACC.hc?1:0;d.dataset.cb=ACC.cb?1:0;d.dataset.rm=ACC.rm?1:0;if(ACC.th=='auto')delete d.dataset.theme;else d.dataset.theme=ACC.th;if(AU&&AU.mx)AU.mx.gain.value=.9*ACC.vol;fbLabels()}
addEventListener('keydown',e=>{if(!G||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.toLowerCase();if(!$('modal').hidden){const n=+k;if(n>=1&&n<=9){const b=$('mb').children[n-1];if(b)b.click()}return}if(k==' '){e.preventDefault();setSp(speed?0:(G.sp0||1))}else if(k>='1'&&k<='5')setSp(+k);else if(k=='escape')menuG();else{const m={g:'g',a:'y',d:'yy',v:'v',s:'s',r:'r'}[k];if(m)setFlag(m)}});
try{const s=JSON.parse(localStorage.getItem('rdsave')||'null');if(s){PT=s.PT||{};TP=s.TP||{};LIC=s.LIC||{};GPN=s.GPN??GPN;Object.assign(cfg,s.cfg||{});CU=s.CU||CU;UU=s.UU||'';GP=s.GP||{};LC=Object.assign(LC,s.LC||{});ACC=Object.assign(ACC,s.ACC||{});RND=s.RND||0;RES=s.RES||[];SEL=s.SEL??-1;(s.cc||[]).forEach(c=>CIRS.push(c))}}catch(e){}
applyAcc();licUI();menuC();startI18n();
</script></body></html>
